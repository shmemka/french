<title>Révisions · Repaso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: французская школьная тетрадь, но мягкая — клетка Seyès в шапках, «перо учителя» для исправлений, синие чернила как акцент. Поверхности без обводок: тон фона + мягкая тень, крупные скругления. */
:root{
  --paper:#f3f4fa; --sheet:#ffffff; --tint:#eef0f9; --tint-2:#e4e7f5;
  --ink:#1a1f3d; --ink-2:#4a5174; --ink-3:#7f85a8; --line:#e6e8f3;
  --seyes:#d7dbf3; --seyes-2:#ecedf9;
  --encre:#3446d0; --encre-2:#2433a3; --encre-soft:#e8ebfd; --on-encre:#ffffff;
  --marge:#d23466; --marge-soft:#fde9ef;
  --ok:#167a4e; --ok-soft:#e0f4e9; --warn:#a56300; --warn-soft:#fdf1da;
  --g-m:#2b5ed3; --g-m-s:#e5ecfd; --g-f:#c02769; --g-f-s:#fce7f0; --g-pl:#0e7d68; --g-pl-s:#dcf3ee;
  --sh-1:0 1px 2px rgba(28,34,82,.04),0 4px 16px rgba(28,34,82,.05);
  --sh-2:0 1px 3px rgba(28,34,82,.04),0 12px 36px rgba(28,34,82,.07);
  --r-xl:26px; --r-lg:20px; --r:16px; --r-sm:12px;
  --font-d:"Alegreya",Georgia,"Times New Roman",serif;
  --font-b:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-h:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1127; --sheet:#181b37; --tint:#21254a; --tint-2:#2a2f5a; --ink:#e7e9fb; --ink-2:#b5badd; --ink-3:#878db5; --line:#2a2e55;
  --seyes:#2b3062; --seyes-2:#1f2347; --encre:#95a5ff; --encre-2:#bac4ff; --encre-soft:#262d63; --on-encre:#10122a;
  --marge:#ff7ba4; --marge-soft:#3d1c34; --ok:#58d596; --ok-soft:#173b2c; --warn:#f3b653; --warn-soft:#3b2c13;
  --g-m:#8fb2ff; --g-m-s:#1f2b57; --g-f:#ff90bf; --g-f-s:#3a1d36; --g-pl:#62dac1; --g-pl-s:#163935;
  --sh-1:0 1px 2px rgba(0,0,0,.25); --sh-2:0 2px 10px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f1127; --sheet:#181b37; --tint:#21254a; --tint-2:#2a2f5a; --ink:#e7e9fb; --ink-2:#b5badd; --ink-3:#878db5; --line:#2a2e55;
  --seyes:#2b3062; --seyes-2:#1f2347; --encre:#95a5ff; --encre-2:#bac4ff; --encre-soft:#262d63; --on-encre:#10122a;
  --marge:#ff7ba4; --marge-soft:#3d1c34; --ok:#58d596; --ok-soft:#173b2c; --warn:#f3b653; --warn-soft:#3b2c13;
  --g-m:#8fb2ff; --g-m-s:#1f2b57; --g-f:#ff90bf; --g-f-s:#3a1d36; --g-pl:#62dac1; --g-pl-s:#163935;
  --sh-1:0 1px 2px rgba(0,0,0,.25); --sh-2:0 2px 10px rgba(0,0,0,.3); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-b);font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
a{color:var(--encre)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
h1,h2,h3,h4,h5{font-family:var(--font-d);text-wrap:balance;margin:0;line-height:1.15}
small{font-size:.8em}

/* ---------- frame: floating sidebar card ---------- */
.topbar{display:none}
.app{display:grid;grid-template-columns:304px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:16px;align-self:start;height:calc(100vh - 32px);margin:16px 0 16px max(16px,env(safe-area-inset-left,0px));background:var(--sheet);border-radius:26px;box-shadow:var(--sh-2);padding:18px 12px 14px;display:flex;flex-direction:column;min-height:0}
.nav-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 6px 14px 10px}
.brand{display:flex;align-items:baseline;gap:7px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--font-d);font-weight:800;font-size:24px;letter-spacing:-.01em}
.brand span{font-family:var(--font-h);color:var(--marge);font-size:21px;transform:rotate(-3deg);display:inline-block}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-3)}
.icon-btn:hover{background:var(--tint);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.nav-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 4px;scrollbar-width:thin}
.nav-main{display:grid;gap:1px;margin-bottom:6px}
.nav a.nl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-size:14px;line-height:1.3;transition:background .15s,color .15s}
.nav a.nl:hover{background:var(--paper);color:var(--ink)}
.nav a.nl.on{background:var(--encre-soft);color:var(--encre-2);font-weight:600}
.nav a.nl.big{font-weight:500;color:var(--ink);font-size:14.5px;padding:8px 10px}
.nav a.nl.big.on{font-weight:600;color:var(--encre-2)}
.nav a.nl.big .ico{width:18px;height:18px;flex:none;color:var(--ink-3)}
.nav a.nl.big.on .ico{color:var(--encre)}
.nl-t{min-width:0}
.nav-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:18px 10px 6px}
.nav-unit{font-size:11.5px;color:var(--ink-3);padding:10px 10px 3px;font-weight:600;letter-spacing:.02em}
.nav-unit i{font-style:normal;font-weight:500}
.ring{--p:0;width:12px;height:12px;flex:none;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--tint-2) 0);position:relative}
.ring::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--sheet)}
.nav a.nl.on .ring::after{background:var(--encre-soft)}
.ring.full{background:var(--ok)}
.nav-foot{display:grid;gap:10px;padding:12px 4px 0;margin-top:6px;border-top:1px solid var(--line)}
.lang-sw{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:12px;padding:3px}
.lang-sw button{border:0;background:transparent;border-radius:9px;padding:6px 8px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.lang-sw button.on{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.lang-sw.big{display:inline-grid;min-width:240px}
.acct{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:6px 8px;border-radius:14px}
.acct:hover,.acct.on{background:var(--paper)}
.acct-av{width:34px;height:34px;flex:none;border-radius:50%;overflow:hidden;background:var(--encre-soft);color:var(--encre);display:flex;align-items:center;justify-content:center}
.acct-av img{width:100%;height:100%;object-fit:cover}
.acct-av svg{width:19px;height:19px}
.acct-tx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.acct-tx b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-tx small{font-size:11.5px;color:var(--ink-3)}
[data-cloud][data-st="saved"]{color:var(--ok)}
[data-cloud][data-st="error"],[data-cloud][data-st="readonly"]{color:var(--warn)}
.nav-show{display:none;position:fixed;z-index:30;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));align-items:center;gap:8px;border:0;background:var(--sheet);box-shadow:var(--sh-2);border-radius:999px;padding:9px 16px 9px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.nav-show svg{width:18px;height:18px;color:var(--encre)}
body.nav-off .nav-show{display:inline-flex}
.app.nav-off{grid-template-columns:minmax(0,1fr)}
.app.nav-off .nav{display:none}
.app.nav-off .main{padding-top:76px}
.main{min-width:0;padding-top:32px;padding-bottom:96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.col{max-width:880px;margin:0 auto}
@media (max-width:979px){
  .app,.app.nav-off{grid-template-columns:minmax(0,1fr)}
  body.nav-off .nav-show{display:none}
  .app.nav-off .nav{display:flex}
  .app.nav-off .main{padding-top:16px}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand b{font-size:22px}
  .menu-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--sheet);box-shadow:var(--sh-1);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px}
  .nav{position:fixed;align-self:auto;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));height:auto;max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));margin:0;overscroll-behavior:contain;visibility:hidden;width:min(320px,calc(100vw - 48px));z-index:50;transform:translateX(calc(-100% - 40px));transition:transform .22s ease}
  .nav.open{transform:none;visibility:visible;box-shadow:0 10px 60px rgba(0,0,0,.28)}
  .nav{transition:transform .22s ease,visibility 0s linear .22s}
  .nav.open{transition:transform .22s ease,visibility 0s}
  body.nav-open{overflow:hidden}
  .nav-scroll{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .icon-btn .ico-x{display:inline}
  .icon-btn .ico-side{display:none}
  .scrim{position:fixed;inset:0;background:rgba(10,12,30,.35);z-index:45}
  .main{padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- seyès ---------- */
.seyes{position:relative;background-color:var(--sheet);border-radius:var(--r-xl);box-shadow:var(--sh-1);
  background-image:linear-gradient(90deg,transparent 47px,color-mix(in srgb,var(--marge) 55%,transparent) 47px,color-mix(in srgb,var(--marge) 55%,transparent) 48px,transparent 48px),
  linear-gradient(var(--seyes) 1px,transparent 1px),linear-gradient(var(--seyes-2) 1px,transparent 1px),linear-gradient(90deg,var(--seyes-2) 1px,transparent 1px);
  background-size:100% 100%,100% 32px,100% 8px,32px 100%;background-position:0 0,0 -1px,0 -1px,0 0}

/* ---------- home ---------- */
.hero{padding:40px 30px 34px 76px;margin-bottom:34px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 12px}
.eyebrow span{text-transform:none;letter-spacing:0;font-weight:500}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.015em}
.hero h1 em{font-style:italic;font-weight:500;color:var(--encre)}
.hero .lead{font-size:17.5px;color:var(--ink-2);max-width:60ch;margin:14px 0 18px}
.hero .annot{font-family:var(--font-h);color:var(--marge);font-size:25px;line-height:1.1;margin:0 0 22px;transform:rotate(-1.5deg);transform-origin:left}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:0;line-height:1.2;transition:background .15s,box-shadow .15s,transform .15s}
.btn.pri{background:var(--encre);color:var(--on-encre)}
.btn.pri:hover{background:var(--encre-2)}
.btn.sec{background:var(--tint);color:var(--ink)}
.btn.sec:hover{background:var(--tint-2)}
.seyes .btn.sec{background:var(--sheet);box-shadow:var(--sh-1)}
.btn.sm{padding:8px 15px;font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:24px;font-size:14px;color:var(--ink-2)}
.stats b{font-family:var(--font-d);font-size:23px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:5px}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 30px;padding:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;background:var(--sheet);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px 18px 20px;font-size:14px;color:var(--ink-2)}
.how li::before{content:counter(s);display:block;font-family:var(--font-h);font-size:32px;line-height:1;color:var(--marge);margin-bottom:8px}
.how li b{color:var(--ink);display:block;margin-bottom:3px;font-size:15px}
@media (max-width:760px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:28px 18px 24px 64px}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 16px}
.sec-h h2{font-size:30px;font-weight:800}
.sec-h p{margin:0;color:var(--ink-3);font-size:14px}
.unit-h{font-family:var(--font-d);font-size:20px;font-weight:700;margin:26px 0 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.unit-h small{font-family:var(--font-b);font-size:13px;color:var(--ink-3);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:14px}
.tc{display:flex;flex-direction:column;gap:7px;background:var(--sheet);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px 18px 16px;text-decoration:none;color:var(--ink);transition:box-shadow .2s,transform .2s}
.tc:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.tc .k{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tc h3{font-size:19px;font-weight:700}
.tc p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.45;flex:1}
.bar{height:5px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.tc .pc{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ref-band{margin-top:44px;padding-top:4px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--encre-soft);color:var(--ink);border-radius:var(--r-lg);padding:14px 18px;font-size:14px;margin:0 0 30px}
.tip svg{flex:none;width:20px;height:20px;color:var(--encre);margin-top:1px}

/* ---------- topic ---------- */
.t-head{padding:32px 28px 28px 76px;margin-bottom:34px}
.t-head h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.01em}
.t-ru{font-size:17px;color:var(--ink-2);margin:10px 0 18px;max-width:60ch}
.t-jump{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.t-head{padding:22px 16px 20px 62px}}
.theory{font-size:16.5px}
.theory > p,.theory .rule p,.theory .sample p{max-width:70ch}
.theory h3{font-size:23px;font-weight:700;margin:42px 0 14px}
.theory h3:first-child{margin-top:0}
.theory p{margin:0 0 14px}
.hint-l{font-size:14px;color:var(--ink-3)}
.tblw{overflow-x:auto;margin:14px 0 20px;border-radius:var(--r-lg);background:var(--sheet);box-shadow:var(--sh-1)}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:14px 16px 8px}
.tbl td{padding:10px 16px;border-top:1px solid var(--line);vertical-align:top}
.tbl tbody tr:first-child td{border-top:0}
.tbl thead + tbody tr:first-child td{border-top:1px solid var(--line)}
.g-m{color:var(--g-m);font-weight:600}.g-f{color:var(--g-f);font-weight:600}.g-pl{color:var(--g-pl);font-weight:600}
.g-m .fr,.g-f .fr,.g-pl .fr{color:inherit}
.fr{cursor:pointer;color:var(--encre-2);text-decoration:underline dotted color-mix(in srgb,var(--encre) 40%,transparent);text-underline-offset:4px;text-decoration-thickness:1px;border-radius:4px;transition:background .15s}
.fr:hover{background:var(--encre-soft)}
.fr.speaking{background:var(--encre-soft)}
.no-tts .fr{cursor:text;text-decoration:none}
.exl{list-style:none;padding:0;margin:10px 0 20px;display:grid;gap:10px}
.exl li{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;padding-left:18px;position:relative}
.exl li::before{content:"";position:absolute;left:2px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--seyes)}
.exl .tr{color:var(--ink-3);font-size:14.5px}
.rule{background:var(--sheet);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px 22px 6px;margin:14px 0 20px}
.rule-t{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--encre);font-weight:700;margin-bottom:10px}
.note{font-family:var(--font-h);font-size:23px;line-height:1.3;color:var(--marge);margin:18px 0 22px;padding:0 0 0 4px;transform:rotate(-.4deg)}
.note .note-t{font-weight:700;font-size:25px;margin-right:4px}
.note .fr{font-family:var(--font-b);font-size:15px;color:var(--ink);font-weight:500}
.warn{background:var(--warn-soft);border-radius:var(--r-lg);padding:14px 20px;margin:14px 0 20px;font-size:15px}
.warn-t{font-weight:700;color:var(--warn);margin-right:4px}
.cmp{display:grid;gap:8px;margin:14px 0 22px}
.cmp p{display:flex;gap:10px;align-items:baseline;margin:0;font-size:15px;color:var(--ink-2)}
.lang{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.07em;padding:3px 8px;border-radius:999px;background:var(--tint-2);color:var(--ink-2)}
.cjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:14px 0 22px}
.cj{background:var(--sheet);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden;padding-bottom:6px}
.cj-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 8px}
.cj-h .fr{font-family:var(--font-d);font-size:21px;font-weight:700;color:var(--ink);text-decoration:none}
.cj-ru{font-size:12.5px;color:var(--ink-3)}
.cj-r{padding:4px 16px;font-size:15px}
.cj-r .fr{color:var(--ink);text-decoration:none}
.cj-r b{color:var(--marge);font-weight:700}
.sample{background:var(--sheet);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px 22px;margin:14px 0 22px}
.sample .tr{color:var(--ink-3);font-size:14.5px}
.chat p{margin:0 0 8px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin:12px 0 20px}
.abc-l{display:flex;flex-direction:column;align-items:center;text-decoration:none;background:var(--sheet);box-shadow:var(--sh-1);border-radius:14px;padding:8px 4px;color:var(--ink)}
.abc-l b{font-family:var(--font-d);font-size:23px}
.abc-l i{font-style:normal;font-size:12px;color:var(--ink-3)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin:12px 0 20px}
.num{display:flex;flex-direction:column;background:var(--sheet);box-shadow:var(--sh-1);border-radius:14px;padding:8px 12px;text-decoration:none;color:var(--ink);font-size:14px}
.num b{font-family:var(--font-d);font-size:21px;color:var(--encre)}
.errs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:12px 0}
.err{background:var(--sheet);box-shadow:var(--sh-1);border-radius:var(--r-lg);padding:14px 16px}
.err p{margin:0}
.err-w .fr{text-decoration:line-through;text-decoration-color:var(--marge);color:var(--ink-3)}
.err-r{margin-top:6px!important}
.err-r .fr{font-weight:600;color:var(--ok);text-decoration:none}
.err-e{font-size:13.5px;color:var(--ink-2);margin-top:6px!important}

.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bin{border-radius:var(--r-lg);min-height:104px;cursor:pointer;background:var(--paper);display:flex;flex-direction:column;transition:background .15s,box-shadow .15s}
.bin:hover,.bin.over{background:var(--encre-soft)}
.bin h5{margin:0;font-size:14px;font-weight:700;padding:10px 14px 4px;font-family:var(--font-b);color:var(--encre-2)}
.bin-l{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 12px;align-content:flex-start;flex:1}
.chip{border:0;background:var(--sheet);box-shadow:var(--sh-1);border-radius:999px;padding:7px 14px;font-size:14.5px;cursor:grab;line-height:1.3;touch-action:manipulation;transition:background .15s,color .15s}
.chip.sel{background:var(--encre);color:var(--on-encre)}
.chip.is-ok{background:var(--ok-soft);color:var(--ok);box-shadow:none;cursor:default}
.chip.is-bad{background:var(--marge-soft);color:var(--marge)}
.chip .pen{font-size:18px;margin-left:4px}
.hintbubble{display:inline-block;font-family:var(--font-h);color:var(--marge);font-size:20px;margin-left:6px}
.ord .ru{margin:0 0 10px;color:var(--ink-2);font-size:15px}
.ord-line{min-height:48px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;margin-bottom:10px;background:var(--tint);border-radius:var(--r);transition:background .2s,box-shadow .2s}
.ord-line.r-ok{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.ord-line .tok{cursor:default;background:var(--sheet)}
.ord-bank{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:0;background:var(--sheet);box-shadow:var(--sh-1);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:15px}
.tok:hover{background:var(--encre-soft)}
.tok.is-bad{background:var(--marge-soft);color:var(--marge)}
.lis{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;color:var(--encre-2);background:var(--encre-soft);border-radius:999px;height:38px;padding:0 15px;cursor:pointer;font-size:13.5px;font-weight:600}
.play:hover{background:var(--tint-2)}
.play svg{width:16px;height:16px}
.lis .read{font-weight:600;color:var(--ink)}
.cards-x{display:grid;gap:14px;justify-items:center;padding:8px 0}
.fcard{width:min(440px,100%);min-height:190px;border-radius:var(--r-xl);background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;cursor:pointer;text-align:center;position:relative;transition:transform .2s}
.fcard:hover{transform:translateY(-2px)}
.fcard .front{font-family:var(--font-d);font-size:32px;font-weight:700;line-height:1.15}
.fcard .back{font-size:18px;color:var(--ink-2)}
.fcard .hint{position:absolute;bottom:10px;font-size:12px;color:var(--ink-3)}
.cards-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13.5px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-size:13px;border-radius:999px}
.seg button.on{background:var(--sheet);color:var(--encre-2);font-weight:600;box-shadow:var(--sh-1)}
.drill{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dr{border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.dr b{font-family:var(--font-d);font-size:23px;font-weight:700}
.dr .tx{font-size:14px;color:var(--ink-2);min-height:1.4em}
.dr .tx[hidden]{display:block!important;visibility:hidden}
.dr .play{align-self:flex-start}

/* ---------- test ---------- */
.mode{display:inline-flex;background:var(--sheet);box-shadow:var(--sh-1);border-radius:999px;padding:4px;margin:4px 0 14px}
.mode button{border:0;background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.mode button.on{background:var(--encre);color:var(--on-encre);font-weight:600}
.test-q{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:16px 0}
.test-q + .test-q{border-top:1px solid var(--line)}
.test-q .n{font-family:var(--font-h);color:var(--marge);font-size:28px;line-height:1;min-width:32px;text-align:right}
.test-q .tq{min-width:0}
.test-q .tp{font-size:12px;color:var(--ink-3);display:block;margin-top:6px}
.grade{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:28px 28px 28px 76px;margin-bottom:26px}
.grade .note20{font-family:var(--font-h);color:var(--marge);font-size:80px;line-height:.9;transform:rotate(-4deg)}
.grade .note20 small{font-size:42px}
.grade h2{font-size:30px;font-weight:800}
.grade p{margin:6px 0 0;color:var(--ink-2)}
.brk{display:grid;gap:10px;margin:12px 0 30px;background:var(--sheet);box-shadow:var(--sh-1);border-radius:var(--r-lg);padding:16px 20px}
.brk-r{display:grid;grid-template-columns:minmax(0,1fr) 140px 48px;gap:14px;align-items:center;font-size:14.5px}
.brk-r a{color:var(--ink);text-decoration:none;min-width:0}
.brk-r a:hover{color:var(--encre)}
.brk-r .bar{margin:0}
.brk-r .bar i.mid{background:var(--warn)}.brk-r .bar i.low{background:var(--marge)}
.brk-r span{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
@media (max-width:520px){.brk-r{grid-template-columns:minmax(0,1fr) 70px 42px}}
.len-pick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.hist{font-size:14px;color:var(--ink-2);background:var(--sheet);box-shadow:var(--sh-1);border-radius:var(--r-lg);padding:14px 20px 14px 36px}
.hist li{font-variant-numeric:tabular-nums;padding:2px 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;flex-wrap:wrap}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--sheet);box-shadow:var(--sh-1);border-radius:var(--r-lg);padding:14px 18px;max-width:48%;color:var(--ink);min-width:0;transition:box-shadow .2s}
.pager a:hover{box-shadow:var(--sh-2)}
.pager a small{font-size:12px;color:var(--ink-3)}
.pager a.next{margin-left:auto;text-align:right}
.cheat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ch{background:var(--sheet);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px 18px}
.ch h3{font-size:21px;margin-bottom:6px}
.ch .tblw{margin:6px 0 10px;box-shadow:none;border-radius:0}
.ch .tbl{font-size:14px}
.ch .tbl td{padding:5px 8px}
.ch .tbl th{padding:6px 8px}
.ch-n{margin:0;font-size:13.5px;color:var(--ink-2)}

/* ---------- account ---------- */
.acc-head{display:flex;gap:22px;align-items:center}
.acc-big{width:72px;height:72px;flex:none;border-radius:50%;overflow:hidden;background:var(--encre-soft);color:var(--encre);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1)}
.acc-big img{width:100%;height:100%;object-fit:cover}
.acc-big svg{width:34px;height:34px}
.cloud-pill{display:inline-block;font-size:13px;font-weight:600;background:var(--sheet);border-radius:999px;padding:4px 12px;box-shadow:var(--sh-1);color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 30px}
.kpi{background:var(--sheet);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--font-d);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi b small{font-size:16px;color:var(--ink-3);font-weight:500}
.kpi span{font-size:13px;color:var(--ink-2)}
.settings-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 14px}
.settings-row > span{min-width:90px;color:var(--ink-2);font-size:14px}
.btn.danger{color:var(--marge)}
.btn.danger.armed{background:var(--marge);color:#fff}
.muted{color:var(--ink-3);font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;transition:opacity .4s}
.toast.out{opacity:0}
@media (max-width:560px){.acc-head{flex-direction:column;align-items:flex-start;gap:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- quizlet ---------- */
.qz-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin:0 0 22px}
.qz-set{border:0;background:var(--sheet);box-shadow:var(--sh-1);border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:box-shadow .15s,background .15s}
.qz-set:hover{box-shadow:var(--sh-2)}
.qz-set b{font-family:var(--font-d);font-size:16.5px;line-height:1.2}
.qz-set small{font-size:12px;color:var(--ink-3);line-height:1.3}
.qz-set .qz-meta{font-size:11.5px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}
.qz-set .bar{margin-top:4px}
.qz-set.on{background:var(--encre);box-shadow:none}
.qz-set.on b,.qz-set.on small,.qz-set.on .qz-meta{color:var(--on-encre)}
.qz-set.on .bar{background:color-mix(in srgb,var(--on-encre) 25%,transparent)}
.qz-set.on .bar i{background:var(--on-encre)}
.qz-modes{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sheet);box-shadow:var(--sh-1);border-radius:999px;padding:5px;margin:0 0 16px}
.qz-modes button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-size:14.5px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.qz-modes button.on{background:var(--encre);color:var(--on-encre);font-weight:600}
.qz-stage{margin-bottom:34px}
.qz-pad{padding:22px 24px 24px}
.qz-pad.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.btns.center{justify-content:center}
.qz-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.qz-ctr{margin-left:auto;font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;background:var(--paper);border-radius:999px;padding:4px 12px}
.qz-ctr + .qz-ctr{margin-left:0}
.qz-ctr.ok{color:var(--ok)}
.chip-t{border:0;background:var(--paper);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip-t.on{background:var(--encre-soft);color:var(--encre-2);font-weight:600}
.qz-card{position:relative;min-height:270px;border-radius:26px;background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:40px 24px;text-align:center;transition:transform .25s,background .25s;user-select:none}
.qz-card:hover{transform:translateY(-2px)}
.qz-card.flipped{background:var(--encre-soft)}
.qz-face{display:flex;flex-direction:column;align-items:center;gap:10px}
.qz-side{font-size:11px;letter-spacing:.12em;color:var(--ink-3);font-weight:700}
.qz-text{font-family:var(--font-d);font-size:clamp(28px,5vw,42px);font-weight:700;line-height:1.15;max-width:22ch}
.qz-card.flipped .qz-text{font-family:var(--font-b);font-weight:500;font-size:clamp(22px,4vw,30px)}
.qz-card .hint{font-size:12px;color:var(--ink-3)}
.qz-cstar{position:absolute;top:14px;right:14px}
.qz-say{position:absolute;top:14px;left:14px;border:0;background:var(--sheet);box-shadow:var(--sh-1);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--encre)}
.qz-say svg{width:17px;height:17px}
.qz-clv{position:absolute;bottom:14px;right:16px}
.qz-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.qz-nav .still{background:var(--warn-soft);color:var(--warn)}
.qz-keys{text-align:center;font-size:12px;color:var(--ink-3);margin:10px 0 0}
.star{border:0;background:transparent;cursor:pointer;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.star svg{width:18px;height:18px;fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-linejoin:round}
.star:hover{background:var(--tint)}
.star.on svg{fill:#f2b01e;stroke:#f2b01e}
.lv{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;letter-spacing:.02em}
.lv0{background:var(--tint);color:var(--ink-3)}
.lv1{background:var(--marge-soft);color:var(--marge)}
.lv2{background:var(--warn-soft);color:var(--warn)}
.lv3{background:var(--ok-soft);color:var(--ok)}
.qz-prog{margin-bottom:18px}
.qz-progbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--tint);gap:2px}
.qz-progbar i{display:block;min-width:0}
.qz-progbar i.lv0{background:var(--tint-2)}.qz-progbar i.lv1{background:var(--marge)}.qz-progbar i.lv2{background:var(--warn)}.qz-progbar i.lv3{background:var(--ok)}
.qz-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.qz-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;padding:0}
.dot.lv0{background:var(--tint-2)}.dot.lv1{background:var(--marge)}.dot.lv2{background:var(--warn)}.dot.lv3{background:var(--ok)}
.qz-q{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--paper);border-radius:22px;padding:28px 20px;margin-bottom:16px}
.qz-kind{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.qz-term{font-family:var(--font-d);font-size:clamp(26px,4.5vw,36px);font-weight:700;line-height:1.2}
.qz-term.fr{color:var(--ink);text-decoration:none}
.qz-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qz-opt{border:0;background:var(--paper);border-radius:16px;padding:14px 16px;font-size:15.5px;cursor:pointer;text-align:left;transition:background .15s}
.qz-opt:hover:not(:disabled){background:var(--encre-soft)}
.qz-opt.is-ok{background:var(--ok-soft);color:var(--ok);font-weight:600;box-shadow:inset 0 0 0 2px var(--ok)}
.qz-opt.is-bad{background:var(--marge-soft);color:var(--marge)}
@media (max-width:560px){.qz-opts{grid-template-columns:minmax(0,1fr)}.qz-pad{padding:18px 16px 20px}}
.qz-write{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qz-write .ans{flex:1 1 220px;width:auto;font-size:17px;padding:10px 14px;margin:0}
.qz-fb{min-height:34px;margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center}
.qz-done{font-family:var(--font-d);font-size:26px;margin:6px 0}
.pen.big{font-size:34px}
.qz-empty{text-align:center;padding:30px 0}
.qz-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.qz-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qz-tile{border:0;min-height:86px;border-radius:16px;background:var(--paper);padding:10px;font-size:14.5px;cursor:pointer;line-height:1.3;transition:opacity .25s,transform .25s,background .15s}
.qz-tile.is-fr{font-weight:600}
.qz-tile:hover{background:var(--encre-soft)}
.qz-tile.sel{background:var(--encre);color:var(--on-encre)}
.qz-tile.ok{background:var(--ok-soft);color:var(--ok)}
.qz-tile.bad{background:var(--marge-soft);color:var(--marge)}
.qz-tile.gone{opacity:0;transform:scale(.9);pointer-events:none}
.qz-list{background:var(--sheet);box-shadow:var(--sh-1);border-radius:var(--r-lg);padding:6px 10px}
.qz-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 4px}
.qz-row + .qz-row{border-top:1px solid var(--line)}
.qz-fr{font-weight:600;color:var(--ink)!important;text-decoration:none!important}
.qz-m{color:var(--ink-2);font-size:14.5px}
@media (max-width:560px){.qz-row{grid-template-columns:auto minmax(0,1fr) auto auto}.qz-m{grid-column:2/4;grid-row:2;margin-top:-4px}}

/* ---------- cloud box ---------- */
.cloud-box{background:var(--encre-soft);border-radius:var(--r-lg);padding:16px 18px;margin:0 0 30px;display:grid;gap:12px;justify-items:start}
.cb-top{display:flex;gap:12px;align-items:flex-start}
.cb-top svg{flex:none;color:var(--encre);margin-top:2px}
.cb-top p{margin:0;font-size:14.5px}
.cb-diag{color:var(--ink-3);font-size:13px!important;margin-top:4px!important}
.cb-diag:empty{display:none}
.cb-check{display:flex;flex-direction:column;gap:2px;background:var(--sheet);border-radius:14px;padding:10px 14px;font-size:14px;width:100%}
.cb-check b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.icon-btn .ico-x{display:none}
.icon-btn span{display:inline-flex}
@media (max-width:979px){.icon-btn .ico-x{display:inline-flex}.icon-btn .ico-side{display:none}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.opt,.chip,.tok,.qz-tile,.qz-opt{overflow-wrap:anywhere}
img,svg{max-width:100%}

/* ---------- phones ---------- */
@media (max-width:600px){
  body{font-size:16px}
  .seyes{background-image:linear-gradient(90deg,transparent 21px,color-mix(in srgb,var(--marge) 55%,transparent) 21px,color-mix(in srgb,var(--marge) 55%,transparent) 22px,transparent 22px),linear-gradient(var(--seyes) 1px,transparent 1px),linear-gradient(var(--seyes-2) 1px,transparent 1px),linear-gradient(90deg,var(--seyes-2) 1px,transparent 1px);border-radius:22px}
  .hero,.t-head,.grade{padding:24px 18px 22px 38px}
  .hero h1{font-size:34px}
  .t-head h1{font-size:30px}
  .hero .lead,.t-ru{font-size:16px}
  .theory{font-size:16px}
  .theory h3{font-size:21px;margin-top:34px}
  .rule{padding:16px 16px 4px}
  .sec-h h2{font-size:25px}
  .practice > h2{font-size:27px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .how{gap:10px}
  .how li{padding:14px}
  .exs{gap:18px}
  .exb{border-radius:22px}
  .accbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:6px 8px;margin-left:-4px;margin-right:-4px}
  .accbar::-webkit-scrollbar{display:none}
  .accbar::before{display:none}
  .acc{flex:none;min-width:36px;height:36px}
  .fillq .ans{width:8.5em}
  .tbl{font-size:14px}
  .tbl td{padding:9px 12px}
  .tbl th{padding:12px 12px 6px}
  .li{padding:24px 12px 10px;font-size:15px}
  .pager{flex-direction:column}
  .pager a{max-width:100%}
  .pager a.next{margin-left:0}
  .mode{display:flex;flex-direction:column;border-radius:20px;width:100%}
  .mode button{border-radius:14px;text-align:left}
  .len-pick .btn{flex:1 1 30%;justify-content:center;padding:10px 8px}
  .grade .note20{font-size:64px}
  .kpi{padding:14px}
  .kpi b{font-size:25px}
  .qz-sets{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .qz-set{padding:10px 12px;border-radius:16px}
  .qz-set small{display:none}
  .qz-set b{font-size:15px}
  .qz-modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;border-radius:18px}
  .qz-modes button{padding:8px 4px;font-size:13px;border-radius:13px}
  .qz-card{min-height:220px;padding:56px 14px 40px;border-radius:22px}
  .qz-nav{display:grid;grid-template-columns:1fr 1fr}
  .qz-nav .btn{justify-content:center;padding:10px 8px}
  .qz-toolbar .seg{order:5}
  .qz-q{padding:22px 14px}
  .qz-tile{min-height:72px;font-size:13.5px}
  .topbar .brand span{font-size:19px}
  .tip{padding:12px 14px}
  .scale{padding:18px 12px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* auth (Supabase) */
.av-l{font-family:var(--font-d);font-weight:700;font-size:1.05em;line-height:1}
.acc-big .av-l{font-size:30px}
.cb-btns{display:flex;flex-wrap:wrap;gap:8px}
.auth{background:var(--sheet);border-radius:var(--r-xl);box-shadow:var(--sh-1);padding:22px 22px 18px;margin:0 0 30px;display:grid;gap:14px;max-width:520px}
.auth h2{margin:2px 0 0;font-size:24px}
.auth-sub{margin:-8px 0 0;color:var(--ink-2);font-size:14.5px}
.auth-tabs{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:12px;padding:3px;justify-self:start;min-width:240px}
.auth-tabs button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ink-2);font:inherit}
.auth-tabs button.on{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.fld{display:grid;gap:6px}
.fld span{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld input{font:inherit;font-size:16px;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid transparent;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box;outline:none;transition:border-color .15s,background .15s}
.fld input:focus{border-color:var(--encre);background:var(--sheet)}
.auth-msg{margin:0;font-size:14px;color:var(--ink-2);min-height:0}
.auth-msg:empty{display:none}
.auth-msg[data-k="err"]{color:var(--marge)}
.auth-msg[data-k="ok"]{color:var(--ok)}
.auth .btn.pri{justify-self:start}
.auth-links{display:flex;flex-wrap:wrap;gap:6px 18px}
.auth-links:empty{display:none}
.auth-links button{border:0;background:none;padding:0;color:var(--encre);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.auth-note{margin:0;font-size:13px;color:var(--ink-3)}
@media (max-width:600px){.auth{padding:18px 16px 16px;border-radius:var(--r-lg)}.auth .btn.pri{justify-self:stretch;justify-content:center}.auth-tabs{justify-self:stretch;min-width:0}}
/* перевод по выделению */
.selpop{position:fixed;z-index:90;left:0;top:0;display:flex;align-items:center;gap:6px;max-width:min(340px,calc(100vw - 16px));background:var(--ink);color:var(--paper);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px rgba(20,24,60,.28);opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s;font-size:14.5px;line-height:1.3;-webkit-user-select:none;user-select:none}
.selpop.below{transform:translateY(-4px)}
.selpop.in{opacity:1;transform:none}
.selpop::after{content:"";position:absolute;left:calc(var(--ax,50%) - 7px);bottom:-6px;width:14px;height:14px;background:inherit;border-radius:3px;transform:rotate(45deg);z-index:-1}
.selpop.below::after{bottom:auto;top:-6px}
.sp-tx{display:flex;flex-direction:column;min-width:0;padding:2px 0}
.sp-fr{font-weight:700;font-size:13px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-m{font-weight:600;overflow-wrap:anywhere}
.selpop[data-st="load"] .sp-m{opacity:.7;font-weight:500;font-style:italic}
.selpop[data-st="none"] .sp-m{opacity:.75;font-weight:500}
.sp-note{font-size:12px;opacity:.6}
.sp-note:empty{display:none}
.sp-btns{display:flex;gap:2px;flex:none;margin-left:4px}
.sp-btns button{width:36px;height:36px;border:0;border-radius:12px;background:transparent;color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,transform .12s}
.sp-btns button:hover{background:rgba(255,255,255,.12)}
.sp-btns button:active{transform:scale(.92)}
.sp-btns button[hidden]{display:none}
.sp-btns svg{width:18px;height:18px}
.sp-fav.on{color:#ff6b93}
.sp-btns button:disabled{opacity:.3;cursor:default;background:transparent;transform:none}
.selpop[data-dir="rev"] .sp-note{opacity:1}
.sp-gl{display:block;opacity:.6}
.sp-alts{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:5px;font-size:12px}
.sp-alts{color:color-mix(in srgb,currentColor 75%,transparent)}
.sp-alt{border:0;background:color-mix(in srgb,currentColor 16%,transparent);color:inherit;border-radius:8px;padding:3px 8px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.sp-alt:hover{background:color-mix(in srgb,currentColor 26%,transparent)}
.sp-fav.on svg,.qz-heart.on svg{fill:currentColor}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .selpop{box-shadow:0 10px 30px rgba(0,0,0,.5)}:root:not([data-theme="light"]) .sp-btns button:hover{background:rgba(0,0,0,.08)}}
:root[data-theme="dark"] .selpop{box-shadow:0 10px 30px rgba(0,0,0,.5)}
.qz-heart{border:0;background:transparent;cursor:pointer;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink-3);transition:color .12s,background .12s}
.qz-heart:hover{background:var(--tint)}
.qz-heart.on{color:var(--marge)}
.qz-heart svg{width:17px;height:17px}
.qz-set.is-fav b{display:flex;align-items:center;gap:6px}
.qz-set.is-fav b svg{width:15px;height:15px;color:var(--marge);fill:currentColor;flex:none}
.qz-favpad{display:grid;justify-items:center;gap:6px;text-align:center}
.qz-favico{width:52px;height:52px;border-radius:50%;background:var(--marge-soft);color:var(--marge);display:flex;align-items:center;justify-content:center}
.qz-favico svg{width:26px;height:26px;fill:currentColor}
.qz-favpad p{max-width:440px;margin:0}
.qz-favempty{padding:6px 4px;margin:0}

/* интервальное повторение */
.qz-modes .m-s{display:none}
.nl-badge{margin-left:auto;background:var(--marge);color:#fff;font-size:11px;font-weight:700;line-height:18px;border-radius:999px;padding:0 6px;min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.srs-cnt{display:inline-flex;gap:12px;font-size:13px;color:var(--ink-3);background:var(--paper);border-radius:999px;padding:5px 13px;font-variant-numeric:tabular-nums}
.srs-cnt b{font-weight:700;font-size:14px;margin-right:2px}
.c-new{color:var(--encre)}.c-lrn{color:var(--marge)}.c-rev{color:var(--ok)}
.srs-card{cursor:default}
.srs-card:not(.flipped){cursor:pointer}
.srs-card .qz-text.is-m{font-family:var(--font-b);font-weight:500;font-size:clamp(22px,4vw,30px)}
.srs-card.flipped .qz-text{font-family:var(--font-d);font-weight:700;font-size:clamp(24px,4vw,34px)}
.srs-card.flipped .qz-text.is-m{font-family:var(--font-b);font-weight:500;font-size:clamp(20px,3.6vw,26px)}
.srs-sep{width:64px;height:2px;border-radius:2px;background:color-mix(in srgb,var(--encre) 30%,transparent);margin:6px 0}
.srs-back{font-size:clamp(21px,3.8vw,28px);font-weight:600;line-height:1.25;color:var(--encre-2);max-width:26ch}
.srs-back.is-fr{font-family:var(--font-d);font-weight:700;font-size:clamp(26px,4.5vw,36px)}
.srs-tag.t0{background:var(--encre-soft);color:var(--encre-2)}
.srs-tag.t1,.srs-tag.t3{background:var(--marge-soft);color:var(--marge)}
.srs-tag.t2{background:var(--ok-soft);color:var(--ok)}
.srs-show{display:flex;justify-content:center;margin-top:16px}
.srs-show .btn{min-width:min(100%,300px);justify-content:center;padding:13px 22px}
.srs-grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.srs-g{border:0;border-radius:16px;padding:10px 6px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;font-weight:600;font-size:15px;line-height:1.25;transition:transform .1s,filter .15s,box-shadow .15s}
.srs-g small{font-size:12px;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
.srs-g:hover{filter:saturate(1.3) brightness(.97)}
.srs-g:active{transform:scale(.97)}
.srs-g:focus-visible{outline:none;box-shadow:0 0 0 2px var(--sheet),0 0 0 4px currentColor}
.srs-g[data-g="1"]{background:var(--marge-soft);color:var(--marge)}
.srs-g[data-g="2"]{background:var(--warn-soft);color:var(--warn)}
.srs-g[data-g="3"]{background:var(--ok-soft);color:var(--ok)}
.srs-g[data-g="4"]{background:var(--encre-soft);color:var(--encre-2)}
.srs-foot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.srs-per{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.srs-per .seg button{padding:4px 10px;font-variant-numeric:tabular-nums}
.srs-how{max-width:100%;flex:1 1 220px;text-align:right}
.srs-how summary{cursor:pointer;color:var(--encre-2);font-weight:600;list-style:none;padding:4px 0}
.srs-how summary::-webkit-details-marker{display:none}
.srs-how summary::after{content:" ▾";font-size:11px}
.srs-how[open] summary::after{content:" ▴"}
.srs-how[open]{flex-basis:100%;text-align:left}
.srs-how p{margin:6px 0 0;line-height:1.55;color:var(--ink-2);font-size:14px}
.srs-done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0 4px}
.srs-done p{margin:0}
.srs-ok{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center}
.srs-ok svg{width:26px;height:26px}
.srs-fch{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3)!important;margin-top:12px!important}
.srs-fc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%;max-width:400px;align-items:end;margin-bottom:8px}
.srs-fc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11.5px;color:var(--ink-3);height:104px}
.srs-fc b{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-height:15px}
.srs-fc i{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--encre)}
.srs-fc i.z{background:var(--tint-2)}
.srs-fc div:first-child span{color:var(--encre-2);font-weight:700}
@media (max-width:600px){
  .qz-modes{grid-template-columns:repeat(5,minmax(0,1fr))}
  .qz-modes button{padding:8px 2px;font-size:12.5px}
  .qz-modes .m-l{display:none}.qz-modes .m-s{display:inline}
  .srs-grade{gap:6px}
  .srs-g{font-size:13.5px;padding:10px 2px 8px;border-radius:14px}
  .srs-cnt{gap:9px;padding:5px 11px}
  .srs-how{text-align:left}
}
@media (pointer:coarse){.qz-stage .qz-keys{display:none}}
.qz-card.flipped .srs-tag.t0{background:var(--sheet)}
/* =========================================================
   v3 — общий редизайн: Manrope, скругления, воздух, без обводок,
   плавные анимации; тёплая тема испанского курса
   ========================================================= */
:root{
  --font-d:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-b:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-h:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r-xl:32px; --r-lg:24px; --r:18px; --r-sm:14px;
  --ease:cubic-bezier(.2,.7,.2,1); --spring:cubic-bezier(.3,1.35,.5,1);
  --sh-1:0 1px 2px rgba(28,34,82,.03),0 8px 24px rgba(28,34,82,.05);
  --sh-2:0 2px 6px rgba(28,34,82,.04),0 18px 48px rgba(28,34,82,.09);
  --db1:#fff1c9; --db2:#ffdcc0; --db3:#dfe2fb; --db-ink:#2b2418;
}
/* испанский: тёплые пастельно-оранжевые тона */
:root[data-course="es"]{
  --paper:#fbf6f1; --sheet:#ffffff; --tint:#f8ede3; --tint-2:#f1e0d0; --ink:#2b1f17; --ink-2:#5c4a3e; --ink-3:#85705f; --line:#f0e4d8;
  --seyes:#f2dac4; --seyes-2:#f9ede2;
  --encre:#b9520f; --encre-2:#8c3c07; --encre-soft:#fde9d8; --on-encre:#ffffff;
  --marge:#c2413b; --marge-soft:#fbe5e1;
  --sh-1:0 1px 2px rgba(92,50,20,.04),0 8px 24px rgba(92,50,20,.06);
  --sh-2:0 2px 6px rgba(92,50,20,.05),0 18px 48px rgba(92,50,20,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--db1:#3d3417;--db2:#45291a;--db3:#252b57;--db-ink:var(--ink)}
  :root[data-course="es"]:not([data-theme="light"]){
    --paper:#18120e; --sheet:#231a14; --tint:#30241b; --tint-2:#3d2e23; --ink:#f6ece3; --ink-2:#d6c3b4; --ink-3:#a99281; --line:#382a20;
    --seyes:#4a3426; --seyes-2:#2f231b; --encre:#ffab6e; --encre-2:#ffc8a0; --encre-soft:#45291a; --on-encre:#2a1608;
    --marge:#ff8e80; --marge-soft:#46221e; --sh-1:0 1px 2px rgba(0,0,0,.3); --sh-2:0 2px 12px rgba(0,0,0,.35);}
}
:root[data-theme="dark"]{--db1:#3d3417;--db2:#45291a;--db3:#252b57;--db-ink:var(--ink)}
:root[data-course="es"][data-theme="dark"]{
  --paper:#18120e; --sheet:#231a14; --tint:#30241b; --tint-2:#3d2e23; --ink:#f6ece3; --ink-2:#d6c3b4; --ink-3:#a99281; --line:#382a20;
  --seyes:#4a3426; --seyes-2:#2f231b; --encre:#ffab6e; --encre-2:#ffc8a0; --encre-soft:#45291a; --on-encre:#2a1608;
  --marge:#ff8e80; --marge-soft:#46221e; --sh-1:0 1px 2px rgba(0,0,0,.3); --sh-2:0 2px 12px rgba(0,0,0,.35);}

body{font-family:var(--font-b);font-size:16.5px;line-height:1.65;letter-spacing:-.005em;font-feature-settings:"ss01"}
h1,h2,h3,h4,h5{font-family:var(--font-d);letter-spacing:-.02em}
html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color .55s var(--ease),color .55s var(--ease),box-shadow .55s var(--ease),fill .55s,stroke .55s!important}

/* ---------- каркас ---------- */
@media (min-width:980px){.app:not(.nav-off){grid-template-columns:312px minmax(0,1fr)}}
.nav{border-radius:30px;padding:16px 14px 16px;box-shadow:var(--sh-2)}
.nav-top{padding:0 0 16px;gap:8px}
.nav a.nl{padding:8px 12px;border-radius:14px;transition:background .2s var(--ease),color .2s,transform .2s var(--ease)}
.nav a.nl:hover{transform:translateX(2px)}
.nav a.nl.big{padding:10px 12px;font-size:14.5px}
.nav a.nl.on{font-weight:700}
.nav-sec{padding:22px 12px 8px;font-weight:700}
.nav-unit{padding:12px 12px 4px}
.nav-foot{border-top:0;padding:14px 2px 0;margin-top:4px;gap:12px}
.lang-sw{border-radius:14px;padding:4px;background:var(--tint)}
.lang-sw button{border-radius:11px;padding:7px 8px;transition:background .2s,color .2s}
.acct{border-radius:16px;padding:8px 10px;transition:background .2s}
.main{padding-top:40px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.col{max-width:900px}
@media (max-width:979px){.main{padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* переключатель курса */
.course-sw{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--tint);border-radius:20px;padding:4px;flex:1;min-width:0}
.course-sw button{position:relative;z-index:1;border:0;background:transparent;border-radius:16px;padding:8px 8px 8px 7px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;min-width:0;color:var(--ink-2);transition:color .3s}
.course-sw button.on{color:var(--ink)}
.course-sw button:not(.on):hover{color:var(--ink)}
.cs-ind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:16px;background:var(--sheet);box-shadow:var(--sh-1);transition:transform .5s var(--spring)}
.course-sw[data-on="es"] .cs-ind{transform:translateX(100%)}
.cs-badge{flex:none;width:28px;height:28px;border-radius:10px;display:inline-grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.03em;color:#fff;transition:opacity .3s,transform .3s var(--spring)}
.cs-fr{background:linear-gradient(140deg,#2f40c4,#5b6df2)}
.cs-es{background:linear-gradient(140deg,#b44f0c,#e2853d)}
.course-sw button:not(.on) .cs-badge{opacity:.5;transform:scale(.92)}
.cs-t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.cs-t b{font-size:13.5px;font-weight:800;white-space:nowrap}
.cs-t small{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand{align-items:center;gap:8px}
.brand b{font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand span{font-family:var(--font-b);transform:none;font-size:13px;color:var(--ink-3);font-weight:600}
.brand .cs-badge{display:inline-grid;color:#fff;font-size:11px;width:26px;height:26px;line-height:1}
@media (max-width:979px){.topbar .brand b{font-size:18px}.topbar .brand .cs-badge{font-size:11px}.topbar .brand span:last-child{font-size:14px;color:var(--ink-3)}}

/* ---------- шапки без «тетради»: мягкий градиент ---------- */
.seyes,.seyes:is(.hero,.t-head,.grade){background-color:var(--sheet);background-image:radial-gradient(110% 130% at 100% 0%,var(--encre-soft) 0%,transparent 58%),radial-gradient(80% 110% at 0% 100%,color-mix(in srgb,var(--marge-soft) 75%,transparent) 0%,transparent 62%);background-size:auto;background-position:0 0;border-radius:var(--r-xl);box-shadow:var(--sh-1)}
.hero{padding:52px 48px 44px;margin-bottom:40px}
.t-head{padding:44px 44px 38px;margin-bottom:44px}
.grade{padding:36px 40px;margin-bottom:32px}
.eyebrow{font-weight:700;letter-spacing:.09em;color:var(--ink-3)}
.hero h1{font-weight:800;letter-spacing:-.035em;font-size:clamp(34px,5.6vw,58px);line-height:1.05}
.hero h1 em{font-style:normal;font-weight:800;color:var(--encre);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--encre-soft) 90%,transparent) 62%);padding:0 .08em}
.t-head h1{font-weight:800;letter-spacing:-.03em}
.hero .lead{font-size:17.5px;line-height:1.6;margin:18px 0 20px}
.hero .annot{display:inline-flex;font-family:var(--font-b);font-size:14px;font-weight:700;color:var(--marge);background:var(--marge-soft);border-radius:999px;padding:6px 14px;transform:none;margin:0 0 26px}
.stats{gap:10px 30px;margin-top:30px}
.stats b{font-family:var(--font-d);font-weight:800;font-size:24px;letter-spacing:-.02em}
.how{gap:16px;margin:0 0 36px}
.how li{border-radius:var(--r-lg);padding:22px 20px 22px;line-height:1.5}
.how li::before{font-family:var(--font-b);font-size:14px;font-weight:800;width:32px;height:32px;border-radius:12px;display:grid;place-items:center;background:var(--encre-soft);color:var(--encre-2);margin-bottom:14px}
.tip{border-radius:var(--r-lg);padding:16px 20px;margin:0 0 36px;line-height:1.55}
.sec-h{margin:22px 0 18px}
.sec-h h2{font-size:30px;font-weight:800;letter-spacing:-.03em}
.unit-h{font-family:var(--font-d);font-size:19px;font-weight:800;margin:32px 0 14px;letter-spacing:-.02em}
.unit-h small{font-weight:600}
.cards{gap:18px;margin-bottom:18px}
.tc{border-radius:var(--r-lg);padding:22px 22px 20px;gap:8px;transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.tc:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.tc h3{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.tc .k{font-weight:700}
.bar{height:6px;background:var(--tint)}
.bar i{transition:width .8s var(--ease)}
.ref-band{margin-top:52px}
.btn{padding:13px 22px;font-weight:700;letter-spacing:-.01em;transition:background .2s,box-shadow .25s var(--ease),transform .2s var(--ease),color .2s}

.btn.pri{box-shadow:0 6px 18px color-mix(in srgb,var(--encre) 28%,transparent)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 24px color-mix(in srgb,var(--encre) 34%,transparent)}
.btn.sm{padding:9px 16px}
.nudge{display:flex;align-items:center;gap:12px;background:var(--encre-soft);color:var(--ink);text-decoration:none;border-radius:var(--r-lg);padding:14px 20px;margin:-14px 0 36px;font-size:14.5px;transition:transform .25s var(--ease)}

/* ---------- тема и теория ---------- */
.theory h3{font-size:24px;font-weight:800;margin:58px 0 18px;letter-spacing:-.025em}
.theory p{line-height:1.7}
.tblw{border-radius:var(--r-lg);margin:18px 0 26px}
.tbl th{font-weight:700;padding:16px 18px 10px}

.tbl tbody tr td:first-child{border-radius:14px 0 0 14px}.tbl tbody tr td:last-child{border-radius:0 14px 14px 0}
.tblw{padding:6px}
.exl{gap:12px;margin:14px 0 24px}
.exl li::before{background:var(--encre);opacity:.35;width:6px;height:6px}
.rule{border-radius:var(--r-lg);padding:22px 26px 10px;margin:18px 0 26px}
.note{font-family:var(--font-b);font-size:15.5px;line-height:1.6;color:var(--ink);background:color-mix(in srgb,var(--encre-soft) 55%,var(--sheet));border-radius:var(--r-lg);padding:18px 22px;margin:18px 0 26px;transform:none}
.note .note-t{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-2);background:var(--sheet);border-radius:999px;padding:3px 10px;margin:0 8px 0 0;vertical-align:1px}
.note .fr{font-size:inherit}
.warn{border-radius:var(--r-lg);padding:18px 22px;margin:18px 0 26px;line-height:1.6}
.warn-t{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--sheet);border-radius:999px;padding:3px 10px;margin-right:8px;vertical-align:1px}
.cmp{margin:18px 0 26px}
.cmp p{background:var(--tint);border-radius:var(--r);padding:12px 16px;line-height:1.55}
.lang{background:var(--sheet);color:var(--encre-2);font-weight:800}
.cjs{gap:16px;margin:18px 0 26px;grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.cj{border-radius:var(--r-lg);padding-bottom:10px}
.cj-h{padding:16px 18px 10px}
.cj-h .fr{font-family:var(--font-d);font-weight:800;letter-spacing:-.02em}
.cj-r{padding:5px 18px}
.cj-rp{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:baseline}
.cj-p{font-size:12.5px;color:var(--ink-3);font-weight:600}
.cj-star{background:linear-gradient(180deg,var(--encre-soft),var(--sheet) 62%)}
.cj-star .cj-ru{color:var(--encre-2);font-weight:700}
.fx-t{border-radius:16px;padding:9px 16px;font-weight:700}
.fxs{border-radius:var(--r-lg)}
.gc{border-radius:16px;box-shadow:none;background:var(--tint)}
.vs-c{border-radius:var(--r-lg);padding:20px 22px}
.vs-big{font-family:var(--font-d);font-weight:800;letter-spacing:-.02em;font-size:20px}
.vs-mid{font-family:var(--font-b);font-size:12px;font-weight:800;color:var(--ink-3);background:var(--tint);border-radius:999px;padding:4px 9px}
.fl-q{border-radius:var(--r)}
.fl-n{font-family:var(--font-b);font-size:12px;font-weight:800;color:var(--encre-2);background:var(--encre-soft);border-radius:9px;min-width:24px;height:24px;display:inline-grid;place-items:center;line-height:1;flex:none}
.fl-res{border-radius:var(--r)}
.fl-res b{font-family:var(--font-d);font-weight:800;font-size:20px}
.rsep{font-family:var(--font-b);font-size:20px;font-weight:700}
.li-arc i{font-family:var(--font-b);font-size:13px;font-weight:800;bottom:20px}
.bc{border-radius:var(--r-lg);padding:20px}
.bc .big{font-family:var(--font-d);font-weight:800;letter-spacing:-.03em}
.boot,.mo-c,.same-g,.sample,.scale,.idcard{border-radius:var(--r-lg)}
.sample{padding:22px 26px}
.abc-l,.num,.wd{border-radius:16px}
.abc-l b,.num b{font-family:var(--font-d);font-weight:800}
.abc-l{cursor:pointer;text-decoration:none!important}
.num{gap:2px}
.num .fr{text-decoration:none;color:var(--ink);font-weight:600}
.pager{margin-top:60px}
.pager a{border-radius:var(--r-lg);padding:16px 20px;transition:box-shadow .25s var(--ease),transform .25s var(--ease)}

/* испанские схемы */
.qa{display:grid;gap:10px;margin:18px 0 26px}
.qa-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 18px;background:var(--sheet);box-shadow:var(--sh-1);border-radius:20px;padding:14px 20px;align-items:center;transition:transform .25s var(--ease)}
.qa-r:hover{transform:translateX(3px)}
.qa-q{font-weight:700;color:var(--ink)!important}
.qa-a{color:var(--encre-2)!important}
.qa-t{grid-column:1/-1;order:-1;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.daybar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 10px}
.db-s{border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;color:var(--db-ink)}
.db-s .fr{font-weight:800;color:var(--db-ink);text-decoration:none;font-size:16px}
.db-s small{font-size:12.5px;opacity:.75;font-weight:600}
.db-s.d1{background:var(--db1)}.db-s.d2{background:var(--db2)}.db-s.d3{background:var(--db3)}
.colloc{display:grid;gap:10px;margin:18px 0 26px}
.co-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sheet);box-shadow:var(--sh-1);border-radius:20px;padding:10px 12px}
.co-v{background:var(--encre);color:var(--on-encre)!important;text-decoration:none!important;font-weight:800;border-radius:14px;padding:6px 12px;min-width:96px;text-align:center}
.co-n{display:flex;flex-wrap:wrap;gap:6px}
.co-n .fr{background:var(--tint);border-radius:12px;padding:5px 11px;font-size:14.5px;text-decoration:none;color:var(--ink)}
.co-n .fr:hover{background:var(--encre-soft)}
.compass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:420px;margin:18px 0 26px}
.cp{background:var(--sheet);box-shadow:var(--sh-1);border-radius:18px;padding:16px 6px;text-align:center;font-weight:700;font-size:15px}
.cp .fr{color:var(--ink);text-decoration:none}
.cp.n,.cp.s,.cp.e,.cp.w{background:var(--encre-soft);box-shadow:none}
.cp.n .fr,.cp.s .fr,.cp.e .fr,.cp.w .fr{color:var(--encre-2);font-weight:800}
.cp-c{display:grid;place-items:center;font-size:30px;color:var(--encre)}
@media (max-width:600px){.qa-r{grid-template-columns:minmax(0,1fr);padding:12px 16px}.daybar{grid-template-columns:minmax(0,1fr)}.co-v{min-width:0}}

/* ---------- упражнения ---------- */
.practice{margin-top:76px}
.practice > h2{font-size:32px;font-weight:800;letter-spacing:-.03em}
.exs{gap:28px}
.exb{border-radius:var(--r-xl)}
.exb-h{padding:26px 28px 8px;gap:16px}
.exb-n{font-family:var(--font-b);font-size:15px;font-weight:800;line-height:1;color:var(--encre-2);background:var(--encre-soft);border-radius:12px;width:34px;height:34px;min-width:34px;display:grid;place-items:center}
.exb-k{font-weight:800}
.exb-h h4{font-weight:700;font-size:17px;letter-spacing:-.01em}
.exb-b{padding:14px 28px 8px}
.exb-f{padding:14px 28px 26px}
.exb-score .pen{font-size:15px}
.exb .it{background:var(--paper);border-radius:20px;padding:16px 18px;margin:0 0 10px}
.it + .it{border-top:0}
.opt{padding:10px 18px;transition:background .2s,color .2s,transform .2s var(--ease)}
.opt:hover:not(:disabled){transform:translateY(-1px)}
.exb .it .opt{background:var(--sheet)}
.exb .it .opt:hover:not(:disabled){background:var(--encre-soft)}
.opt.is-ok,.exb .it .opt.is-ok{box-shadow:none;background:var(--ok-soft)}
.opt.is-bad,.exb .it .opt.is-bad{background:var(--marge-soft)}
.opt.sel{box-shadow:none;background:var(--encre);color:var(--on-encre)}
.pen{font-family:var(--font-b);font-size:15px;font-weight:700;line-height:1.3}
.ok-t{font-family:var(--font-b);font-size:15px;font-weight:800;line-height:1.3}
.acc-t{font-family:var(--font-b);font-size:15px;font-weight:800;line-height:1.3}
.pen.big{font-size:22px}
.hintbubble{font-family:var(--font-b);font-size:14px;font-weight:700}
.ans{border-radius:14px;padding:9px 14px;background:var(--sheet)}
.exb .it .ans{background:var(--sheet)}
.ans:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--encre) 35%,transparent)}
.ans.r-ok{box-shadow:none;background:var(--ok-soft)}
.ans.r-bad{box-shadow:none;background:var(--marge-soft)}
.ans.r-acc{box-shadow:none;background:var(--warn-soft)}
.accbar{border-radius:var(--r);padding:8px 10px}
.acc{border-radius:12px;box-shadow:none;transition:background .15s,transform .15s var(--ease)}
.acc:active{transform:scale(.92)}
.conj-card{border-radius:var(--r-lg);padding:8px 0 12px}
.conj-card h5{font-family:var(--font-d);font-weight:800}
.match .opt{border-radius:16px}
.sort-pool,.bin{border-radius:var(--r-lg)}
.chip{transition:background .2s,color .2s,transform .2s var(--ease)}
.chip:hover{transform:translateY(-1px)}
.ord-line{border-radius:var(--r)}
.ord-line.r-ok{box-shadow:none}
.tok{border-radius:12px;transition:background .15s,transform .2s var(--ease)}
.fcard{border-radius:var(--r-xl)}
.fcard .front{font-family:var(--font-d);font-weight:800;letter-spacing:-.02em}
.dr{border-radius:var(--r-lg)}
.dr b{font-family:var(--font-d);font-weight:800}

/* ---------- контрольная, кабинет ---------- */
.mode{border-radius:999px;padding:5px}
.mode button{padding:8px 16px;transition:background .2s,color .2s}
.test-q{background:var(--paper);border-radius:20px;padding:16px 18px;margin-bottom:10px}
.test-q + .test-q{border-top:0}
.test-q .n{font-family:var(--font-b);font-size:13px;font-weight:800;color:var(--encre-2);background:var(--encre-soft);border-radius:10px;min-width:30px;height:30px;display:grid;place-items:center;text-align:center}
.test-q .opt{background:var(--sheet)}
.test-q .ans{background:var(--sheet)}
.grade .note20{font-family:var(--font-d);font-weight:800;color:var(--encre);font-size:76px;letter-spacing:-.04em;transform:none}
.grade .note20 small{font-size:30px;color:var(--ink-3)}
.brk,.hist,.kpi,.qz-list{border-radius:var(--r-lg)}
.brk{padding:20px 24px;gap:12px}
.kpis{gap:14px;margin-bottom:36px}
.kpi{padding:18px 20px}
.kpi b{font-family:var(--font-d);font-weight:800;letter-spacing:-.03em}
.hist{padding:16px 24px 16px 40px}
.acc-card{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--sheet);box-shadow:var(--sh-1);border-radius:var(--r-xl);padding:22px 24px;margin:0 0 38px;animation:rise .45s var(--ease) both}
.acc-card.soft{background:var(--tint);box-shadow:none}
.acc-card p{margin:0;font-size:15px;line-height:1.5}
.acc-ic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--encre-soft);color:var(--encre)}
.acc-ic svg{width:22px;height:22px}
.acc-card.good .acc-ic{background:var(--ok-soft);color:var(--ok)}
.acc-card.warn .acc-ic{background:var(--warn-soft);color:var(--warn)}
.acc-tx{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-tx small{color:var(--ink-3);font-size:13px}
.acc-card .cb-btns{margin-left:auto}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--encre) 25%,transparent);border-top-color:var(--encre);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud-pill{box-shadow:none;background:var(--sheet);font-weight:700}
.auth{max-width:460px;padding:32px 32px 26px;border-radius:var(--r-xl);gap:16px;margin:0 0 40px;box-shadow:var(--sh-2);transition:opacity .16s var(--ease),transform .16s var(--ease);animation:rise .45s var(--ease) both}
.auth.swap{opacity:0;transform:translateY(6px)}
.auth.shake{animation:shake .4s}
.auth-ico{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--encre-soft);color:var(--encre)}
.auth-ico svg{width:26px;height:26px}
.auth h2{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:0}
.auth-sub{margin:-8px 0 4px;line-height:1.5}
.fld span{font-weight:700}
.fld input{border:0;border-radius:16px;padding:14px 16px;background:var(--tint);transition:background .2s,box-shadow .2s}
.fld input:focus{background:var(--sheet);box-shadow:0 0 0 3px color-mix(in srgb,var(--encre) 35%,transparent)}
.fld-wrap[hidden]{display:none}
.auth .btn.pri.auth-go{justify-self:stretch;justify-content:center;padding:15px 22px;font-size:16px}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--on-encre) 35%,transparent);border-top-color:var(--on-encre);animation:spin .8s linear infinite}
.auth-links{justify-content:space-between;gap:8px 16px;font-size:14px;color:var(--ink-2)}
.auth-links button{font-weight:700;text-decoration:none}
.auth-links button:hover{text-decoration:underline}
.auth-msg{padding:12px 14px;border-radius:14px;background:var(--tint);animation:fadein .25s}
.auth-msg[data-k="err"]{background:var(--marge-soft)}
.auth-msg[data-k="ok"]{background:var(--ok-soft)}
@media (max-width:600px){.auth{padding:24px 20px 20px}}

/* ---------- лексика ---------- */
.lex-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.lex-search{display:flex;align-items:center;gap:8px;background:var(--sheet);box-shadow:var(--sh-1);border-radius:999px;padding:0 16px;flex:1 1 220px;max-width:340px;transition:box-shadow .2s}
.lex-search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--encre) 30%,transparent)}
.lex-search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.lex-search input{border:0;background:transparent;font:inherit;font-size:15px;padding:11px 0;width:100%;outline:none;color:var(--ink)}
.lex-units button{white-space:nowrap}
.lex-count{color:var(--ink-3);font-size:13.5px;margin:-20px 0 16px;font-weight:600}
.lex{display:grid;gap:30px}
.lex-h{font-size:19px;font-weight:800;margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lex-h small{font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.lex-u{font-size:11px;font-weight:800;background:var(--encre-soft);color:var(--encre-2);border-radius:8px;padding:3px 8px;align-self:center}
.lex-rows{background:var(--sheet);box-shadow:var(--sh-1);border-radius:var(--r-lg);padding:6px}
.lex-r{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr) minmax(0,1.5fr);gap:4px 20px;padding:11px 14px;border-radius:16px;align-items:baseline}
.lex-r:nth-child(odd){background:color-mix(in srgb,var(--tint) 55%,transparent)}
.lex-w{font-weight:700;color:var(--ink)!important;text-decoration:none!important}
.lex-en{color:var(--ink-2);font-size:14.5px;transition:filter .3s var(--ease),opacity .3s}
.lex-ex{font-size:14.5px;color:var(--ink-2)!important;text-decoration:none!important;font-style:italic}
.lex-hide .lex-en:not(.peek){filter:blur(6px);opacity:.55;cursor:pointer;user-select:none}
@media (max-width:640px){.lex-r{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 12px}.lex-ex{grid-column:1/-1}.lex-tools .seg{order:3}}

/* ---------- анимации ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.95)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
.main.enter > .col > *, .main.enter > .col > article > *{animation:rise .55s var(--ease) both}
.main.enter > .col > :nth-child(2), .main.enter > .col > article > :nth-child(2){animation-delay:.06s}
.main.enter > .col > :nth-child(3), .main.enter > .col > article > :nth-child(3){animation-delay:.12s}
.main.enter > .col > :nth-child(4), .main.enter > .col > article > :nth-child(4){animation-delay:.16s}
.main.enter > .col > :nth-child(n+5){animation-delay:.2s}
.main.enter .cards .tc{animation:rise .55s var(--ease) both}
.main.enter .cards .tc:nth-child(2){animation-delay:.04s}.main.enter .cards .tc:nth-child(3){animation-delay:.08s}.main.enter .cards .tc:nth-child(4){animation-delay:.12s}.main.enter .cards .tc:nth-child(n+5){animation-delay:.16s}
.fb:not([hidden]){animation:fadein .3s var(--ease)}
.opt.is-ok,.chip.is-ok,.qz-opt.is-ok,.ans.r-ok{animation:pop .35s var(--ease)}
.toast{border-radius:999px;padding:12px 20px;font-weight:600;animation:toastin .35s var(--spring)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.selpop{border-radius:18px}
.selpop.no-fav .sp-fav{display:none}
@media (max-width:600px){
  .hero,.t-head,.grade{padding:30px 22px 26px}
  .hero h1{font-size:36px}
  .t-head h1{font-size:30px}
  .sec-h h2{font-size:25px}
  .theory h3{font-size:21px;margin-top:44px}
  .exb-h{padding:20px 18px 6px}.exb-b{padding:10px 18px 6px}.exb-f{padding:10px 18px 20px}
  .exb .it{padding:14px 14px}
  .course-sw button{padding:7px 6px;gap:6px}
  .cs-t b{font-size:13px}
}

.qz-row + .qz-row{border-top:0}
.qz-row{border-radius:14px;padding:8px 8px}
.qz-row:nth-child(odd){background:color-mix(in srgb,var(--tint) 55%,transparent)}
.qz-list{padding:8px}
.srs-foot{border-top:0;padding-top:4px}
.qz-set{border-radius:20px;transition:box-shadow .25s var(--ease),transform .25s var(--ease),background .25s}
.qz-set:hover{transform:translateY(-2px)}
.qz-set b{font-family:var(--font-d);font-weight:800;letter-spacing:-.02em}
.qz-card{border-radius:var(--r-xl)}
.qz-text{font-family:var(--font-d);font-weight:800;letter-spacing:-.02em}
.ch{border-radius:var(--r-lg);padding:20px 22px}
.ch h3{font-weight:800}
.ch .tblw{padding:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* =========================================================
   ПЛАТФОРМА: профиль, геймификация, вход, магазин, кабинет, банк, карточки
   ========================================================= */
/* аватар */
.av{--s:36px;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;background:var(--avbg);display:inline-grid;place-items:center;isolation:isolate}
.av-e{font-size:calc(var(--s)*.56);line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.av-s{--s:30px}.av-m{--s:42px}.av-l{--s:56px}.av-xl{--s:84px}
.av[class*="fr-"]::before{content:"";position:absolute;inset:calc(var(--s)*-.09);border-radius:50%;z-index:-1}
.av.fr-silver::before{background:linear-gradient(135deg,#f2f4f8,#9aa3b5 45%,#e9edf3 70%,#8b93a6)}
.av.fr-gold::before{background:linear-gradient(135deg,#fff3b0,#d89b00 45%,#ffe58a 70%,#b37800)}
